<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <title>भिडियो अप्टाइजर</title>
</head>
<body>
    <input id="source" type="file" accept="video/*" />
    <label for="posting-device">भेरिएन्ट छान्नुहोस्:</label>
    <select id="posting-device">
        <option value="variant-1">Variant 1 — Experimental</option>
        <option value="variant-2">Variant 2 — HOLY AGGRESSIVE</option>
        <option value="variant-3">Variant 3 — Not Aggressive</option>
    </select>
    <button id="start">Downscale & patch</button>
    <button id="cancel" disabled>Cancel</button>
    <progress id="progress" max="100" value="0"></progress>
    <p id="message" role="status"></p>
    <a id="result" hidden>Download MP4</a>
    <p>Powered by <a href="https://compressbase.com/">CompressBase</a></p>

    <script type="module">
        import { downscaleVideo } from 'https://compressbase.com/method-api/downscale.mjs';
        import { patchVideo } from 'https://compressbase.com/method-api/client.mjs';
        const $ = id => document.getElementById(id);
        let controller, downloadUrl;
        $('cancel').onclick = () => controller?.abort();
        $('start').onclick = async () => {
            const file = $('source').files[0];
            if (!file) return;
            const postingDevice = $('posting-device').value;
            if (!postingDevice) { $('message').textContent = 'पहिले एउटा भेरिएन्ट छान्नुहोस्।'; return; }
            controller = new AbortController();
            $('start').disabled = true; $('cancel').disabled = false;
            $('result').hidden = true; $('progress').value = 0;
            const onStatus = text => { $('message').textContent = text; };
            try {
                const mp4 = await downscaleVideo(file, {
                    signal: controller.signal, onStatus,
                    onProgress: fraction => { $('progress').value = fraction * 95; }
                });
                const output = await patchVideo(mp4, {
                    postingDevice, signal: controller.signal, onStatus
                });
                controller.signal.throwIfAborted();
                if (downloadUrl) URL.revokeObjectURL(downloadUrl);
                downloadUrl = URL.createObjectURL(output);
                $('result').href = downloadUrl;
                $('result').download = 'compressbase_patched.mp4';
                $('result').hidden = false; $('progress').value = 100;
                onStatus('डाउनलोडको लागि तयार।');
            } catch (error) {
                onStatus(error.message || 'प्रक्रिया रोकियो।');
            } finally {
                $('start').disabled = false; $('cancel').disabled = true;
            }
        };
    </script>
</body>
</html>
