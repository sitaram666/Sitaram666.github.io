<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Optimizer</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #161b22;
      --accent: #ff3b5c;
      --text: #ffffff;
      --border: #30363d;
      --success: #238636;
    }
    body { font-family: sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { width: 100%; max-width: 500px; background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 30px; text-align: center; }
    h1 { font-size: 24px; margin-bottom: 10px; }
    .subtitle { color: #8b949e; font-size: 14px; margin-bottom: 20px; }
    .upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 30px; cursor: pointer; transition: 0.2s; }
    .upload-area:hover { border-color: var(--accent); }
    input[type="file"] { display: none; }
    .video-info { display: none; margin-top: 20px; text-align: left; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; }
    .info-item { font-size: 14px; margin: 5px 0; }
    .action-btn { background-color: var(--accent); color: var(--text); border: none; border-radius: 10px; padding: 12px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 20px; display: none; }
    .action-btn:disabled { opacity: 0.5; }
    .status { margin-top: 15px; font-size: 14px; }
    .progress-bar { width: 100%; height: 6px; background-color: var(--border); border-radius: 3px; margin-top: 10px; overflow: hidden; display: none; }
    .progress-fill { height: 100%; background-color: var(--accent); width: 0%; transition: 0.2s; }
    video { width: 100%; border-radius: 10px; margin-top: 20px; display: none; }
    .download-link { display: none; background-color: var(--success); color: var(--text); text-decoration: none; border-radius: 10px; padding: 12px; display: block; margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Video Optimizer</h1>
    <div class="subtitle">Maintain quality, optimized for TikTok</div>
    <div class="upload-area" onclick="document.getElementById('file-input').click()">
      <p>Choose a video file</p>
      <span>or drag and drop it here</span>
    </div>
    <input type="file" id="file-input" accept="video/*">
    <div class="video-info" id="video-info">
      <div class="info-item"><strong>File:</strong> <span id="file-name"></span></div>
      <div class="info-item"><strong>Size:</strong> <span id="file-size"></span></div>
      <div class="info-item"><strong>Resolution:</strong> <span id="val-res"></span></div>
    </div>
    <button class="action-btn" id="action-btn" onclick="processVideo()">Optimize Video</button>
    <div class="status" id="status"></div>
    <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <video id="player" controls></video>
    <a id="download-link" class="download-link" download="optimized.mp4">Download Optimized Video</a>
  </div>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="[https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.js](https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.js)"></script>

   <script>let ffmpeg = null;
    let selectedFile = null;
    const fileInput = document.getElementById('file-input');
    const videoInfo = document.getElementById('video-info');
    const actionBtn = document.getElementById('action-btn');
    const statusText = document.getElementById('status');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const player = document.getElementById('player');
    const downloadLink = document.getElementById('download-link');
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });
    function handleFile(file) {
      selectedFile = file;
      document.getElementById('file-name').textContent = file.name;
      document.getElementById('file-size').textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
      const tempVideo = document.createElement('video');
      tempVideo.src = URL.createObjectURL(file);
      tempVideo.onloadedmetadata = () => {
        document.getElementById('val-res').textContent = `${tempVideo.videoWidth}x${tempVideo.videoHeight}`;
      };
      videoInfo.style.display = 'block';
      actionBtn.style.display = 'block';
      statusText.textContent = '';
      player.style.display = 'none';
      downloadLink.style.display = 'none';
    }
    async function initFFmpeg() {
      if (ffmpeg === null) {
        const { FFmpeg } = FFmpegWASM;
        ffmpeg = new FFmpeg();
        ffmpeg.on('progress', ({ progress }) => {
          progressBar.style.display = 'block';
          const percent = Math.round(progress * 100);
          progressFill.style.width = percent + '%';
          statusText.textContent = `Processing: ${percent}%`;
        });
        statusText.textContent = 'Loading engine...';
        await ffmpeg.load();
      }
    }
    async function processVideo() {
      if (!selectedFile) return;
      actionBtn.disabled = true;
      try {
        await initFFmpeg();
      
        await FFmpegWASM.fetchFile(selectedFile)⁠
        statusText.textContent = 'Optimizing video quality...';
        await ffmpeg.exec([
          '-i', 'input.mp4',
          '-c:v', 'libx264',
          '-preset', 'ultrafast',
          '-crf', '24',
          '-c:a', 'aac',
          '-b:a', '128k',
          '-y', 'output.mp4'
        ]);
        const data = await ffmpeg.readFile('output.mp4');
        const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
        const videoUrl = URL.createObjectURL(videoBlob);
        player.src = videoUrl;
        player.style.display = 'block';
        downloadLink.href = videoUrl;
        downloadLink.style.display = 'block';
        statusText.textContent = 'Optimization complete!';
        progressBar.style.display = 'none';
      } catch (err) {
        statusText.textContent = 'Error: ' + err.message;
      } finally {
        actionBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
