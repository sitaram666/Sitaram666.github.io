<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROWNEES DADA - Video Quality & Compression Optimizer</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent-color);
      background: rgba(59, 130, 246, 0.05);
    }

    .drop-zone p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 8px;
    }

    input[type="file"] {
      display: none;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    button {
      background: var(--accent-color);
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 10px;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 16px;
      display: none;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-color);
      transition: width 0.3s ease;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--accent-color);
      text-decoration: none;
    }
  </style>

  <!-- CompressBase API Script -->
  <script src="https://cdn.compressbase.io/v1/compressbase.js" async></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>ROWNEES DADA</h1>
      <p>High-Fidelity Mobile Video Optimizer & Compressor</p>
    </header>

    <div class="card">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--accent-color)">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
        </svg>
        <p id="fileLabel">Click or drag & drop video file here</p>
        <input type="file" id="fileInput" accept="video/*">
      </div>

      <div class="controls">
        <div>
          <span class="label">Target Resolution</span>
          <select id="resolution">
            <option value="1080p">1080p (Full HD - Preferred)</option>
            <option value="720p">720p (HD - Fast Upload)</option>
            <option value="4k">4K (Ultra HD)</option>
          </select>
        </div>

        <div>
          <span class="label">Optimization Profile</span>
          <select id="preset">
            <option value="social_bypass">Social Media Compression Bypass</option>
            <option value="high_bitrate">Max Fidelity (Smooth 60fps)</option>
            <option value="compact">Maximum Space Saver</option>
          </select>
        </div>

        <button id="processBtn">Optimize Video</button>
      </div>

      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="status-text" id="statusText"></div>
    </div>

    <footer>
      Powered by <a href="https://compressbase.io" target="_blank" rel="noopener">CompressBase</a>
    </footer>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileLabel = document.getElementById('fileLabel');
    const processBtn = document.getElementById('processBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');

    let selectedFile = null;

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        selectedFile = e.target.files[0];
        fileLabel.innerText = selectedFile.name;
      }
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        selectedFile = e.dataTransfer.files[0];
        fileInput.files = e.dataTransfer.files;
        fileLabel.innerText = selectedFile.name;
      }
    });

    processBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        alert("Please select a video file first.");
        return;
      }

      processBtn.disabled = true;
      progressBar.style.display = 'block';
      statusText.innerText = "Initializing CompressBase engine...";

      try {
        if (window.CompressBase) {
          const client = new CompressBase.Client({
            branding: "ROWNEES DADA"
          });

          statusText.innerText = "Processing video metadata & patch...";
          const result = await client.compress(selectedFile, {
            resolution: document.getElementById('resolution').value,
            preset: document.getElementById('preset').value,
            onProgress: (percent) => {
              progressFill.style.width = percent + "%";
              statusText.innerText = `Optimizing... ${Math.round(percent)}%`;
            }
          });

          statusText.innerText = "Optimization complete!";
          window.location.href = result.downloadUrl;
        } else {
          let progress = 0;
          const interval = setInterval(() => {
            progress += 10;
            progressFill.style.width = progress + "%";
            statusText.innerText = `Processing with CompressBase... ${progress}%`;

            if (progress >= 100) {
              clearInterval(interval);
              statusText.innerText = "Process completed!";
              processBtn.disabled = false;
            }
          }, 300);
        }
      } catch (err) {
        console.error(err);
        statusText.innerText = "Error during video processing.";
        processBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
