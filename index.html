<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronish Dada Video Compressor</title>
    <style>
        body { font-family: sans-serif; background-color: #000; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; border: 1px solid #333; padding: 20px; border-radius: 15px; }
        .upload-section { margin: 20px 0; border: 2px dashed #4a90e2; padding: 30px; border-radius: 10px; cursor: pointer; }
        .btn { background-color: #4a90e2; color: #fff; padding: 15px 30px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
        .hidden { display: none; }
    </style>
    <!-- Load FFmpeg.wasm -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
</head>
<body>
    <div class="container">
        <h1>Ronish Dada Video Compressor</h1>
        
        <!-- Normal Video Option -->
        <div class="upload-section" onclick="document.getElementById('upload-normal').click()">
            <p>Drop your normal video here</p>
            <p>or choose a file</p>
            <button class="btn">Choose normal 4K 120fps video</button>
            <input type="file" id="upload-normal" accept="video/*" class="hidden">
        </div>
        
        <!-- HDR Video Option -->
        <div class="upload-section" onclick="document.getElementById('upload-hdr').click()">
            <p>Drop your HDR video here</p>
            <p>or choose a file</p>
            <button class="btn">Choose HDR video</button>
            <input type="file" id="upload-hdr" accept="video/*" class="hidden">
        </div>
        
        <p id="status"></p>
        <video id="player" controls class="hidden" width="100%"></video>
        <button id="download-btn" class="btn hidden">Download Compressed Video</button>
    </div>

    <script>
        const { FFmpeg } = FFmpegWASM;
        const { fetchFile, toBlobURL } = FFmpegUtil;
        let ffmpeg = null;

        async function initFFmpeg() {
            if (ffmpeg === null) {
                ffmpeg = new FFmpeg();
                const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
                await ffmpeg.load({
                    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                });
            }
        }

        async function handleCompression(file) {
            document.getElementById('status').innerText = "Loading FFmpeg and processing video...";
            await initFFmpeg();

            const inputName = file.name;
            const outputName = 'compressed_' + file.name;

            await ffmpeg.writeFile(inputName, await fetchFile(file));
            
            // Compress video using H.264 codec and CRF for quality
            await ffmpeg.exec([
                '-i', inputName, 
                '-c:v', 'libx264', 
                '-crf', '22', 
                '-preset', 'fast', 
                '-c:a', 'aac', 
                outputName
            ]);

            const data = await ffmpeg.readFile(outputName);
            const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
            
            const player = document.getElementById('player');
            player.src = URL.createObjectURL(videoBlob);
            player.classList.remove('hidden');

            const downloadBtn = document.getElementById('download-btn');
            downloadBtn.href = player.src;
            downloadBtn.download = outputName;
            downloadBtn.classList.remove('hidden');

            document.getElementById('status').innerText = "Video compressed successfully!";
        }

        document.getElementById('upload-normal').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) handleCompression(file);
        });

        document.getElementById('upload-hdr').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) handleCompression(file);
        });
        
        document.getElementById('download-btn').addEventListener('click', function() {
            this.click();
        });
    </script>
</body>
</html>
